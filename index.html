<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxiBus 预约管理助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col antialiased">

    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-500 p-2 rounded-xl text-2xl shadow-inner">🚌</div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">TaxiBus 预约管理助手</h1>
                    <p class="text-xs text-indigo-200">轻松记录与追踪 ZWS 预约车次，告别繁琐后台</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <a href="https://www.zws-online.de/fahrplaene-liniennetz/meintaxibus/buchen-ueber-internet" target="_blank" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1 border border-indigo-500 shadow-sm">
                    🌐 打开官方预约网
                </a>
                <a href="https://esm.ansat.de/VGWS/ansat/ast_efa.aspx?Auskunft" target="_blank" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1 border border-indigo-500 shadow-sm">
                    📋 官方查询管理
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- Notification Toast -->
        <div id="toast" class="hidden fixed top-5 right-5 z-50 bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-lg transition-all duration-300 transform translate-y-0 text-sm font-medium flex items-center gap-2">
            <span>✅</span> <span id="toast-msg">操作成功</span>
        </div>

        <!-- Action Bar & Add Button -->
        <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <h2 class="text-base font-semibold text-slate-800">我的预约记录</h2>
                <p class="text-xs text-slate-500" id="total-count">共 0 条行程</p>
            </div>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition shadow-md shadow-indigo-100 flex items-center gap-1.5 active:scale-95">
                <span>➕</span> 新增预约记录
            </button>
        </div>

        <!-- Booking List Container -->
        <div id="booking-list" class="space-y-4">
            <!-- Dynamic items will be injected here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12 bg-white rounded-2xl border border-slate-100 shadow-sm">
            <div class="text-4xl mb-3">📭</div>
            <h3 class="text-sm font-semibold text-slate-700">暂无预约记录</h3>
            <p class="text-xs text-slate-400 mt-1">点击右上角“新增预约记录”将您的 TaxiBus 订单保存到本地</p>
        </div>

    </main>

    <!-- Modal for Adding/Editing Booking -->
    <div id="booking-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100 transform transition-all">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 id="modal-title" class="font-semibold text-slate-800 text-base">新增预约行程</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <form id="booking-form" onsubmit="saveBooking(event)" class="p-6 space-y-4">
                <input type="hidden" id="booking-id">
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">乘车日期 *</label>
                        <input type="date" id="b-date" required class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">发车时间 *</label>
                        <input type="time" id="b-time" required class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">出发站 (Start) *</label>
                    <input type="text" id="b-from" placeholder="例如: Saßmicke L512, Olpe" required class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">到达站 (Ziel) *</label>
                    <input type="text" id="b-to" placeholder="例如: Hillmicke Siedlung, Wenden" required class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">预订号 / Buch-Nr.</label>
                        <input type="text" id="b-no" placeholder="例如: 12345 (选填)" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">车票类型</label>
                        <select id="b-ticket" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="Zeitkarte: vorh. (月票/D-Ticket)">Zeitkarte (月票/D-Ticket)</option>
                            <option value="Einzelfahrkarte Erwachsene: vorh.">单程票 (已持有)</option>
                            <option value="Einzelfahrkarte Erwachsene (3.20€)">单程票 (3.20€)</option>
                            <option value="Tageskarte 1Person">日票 (1人)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">备注说明 (选填)</label>
                    <input type="text" id="b-note" placeholder="例如: 记得带月票上车" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition">取消</button>
                    <button type="submit" class="px-5 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl transition shadow-sm">保存预约</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // LocalStorage Key
        const STORAGE_KEY = 'taxibus_bookings_v1';

        // Initialize App on Load
        window.onload = function() {
            renderBookings();
            // Set default date to today
            document.getElementById('b-date').valueAsDate = new Date();
        };

        // Get Bookings from LocalStorage
        function getBookings() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // Save Bookings to LocalStorage
        function saveBookingsToStorage(bookings) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
        }

        // Render Bookings List
        function renderBookings() {
            const bookings = getBookings();
            const container = document.getElementById('booking-list');
            const emptyState = document.getElementById('empty-state');
            const totalCount = document.getElementById('total-count');

            totalCount.innerText = `共 ${bookings.length} 条行程`;

            if (bookings.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            // Sort bookings by date and time (newest/upcoming first)
            bookings.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));

            container.innerHTML = bookings.map(b => {
                const bookingDateTime = new Date(`${b.date}T${b.time}`);
                const isPast = bookingDateTime < new Date();

                return `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 transition hover:shadow-md ${isPast ? 'opacity-60 bg-slate-50/50' : ''}">
                        <div class="space-y-1.5 flex-grow">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-0.5 rounded-full flex items-center gap-1">
                                    🚕 RUF TaxiBus
                                </span>
                                <span class="text-xs font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">
                                    📅 ${b.date} &nbsp; ⏰ ${b.time}
                                </span>
                                ${b.no ? `<span class="text-xs font-mono bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md font-semibold">No: ${b.no}</span>` : ''}
                                ${isPast ? '<span class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-md">已过期</span>' : '<span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md font-medium">即将出行</span>'}
                            </div>
                            
                            <div class="text-sm font-semibold text-slate-800 flex items-center gap-2 mt-1">
                                <span class="text-indigo-600">📍 从:</span> ${escapeHtml(b.from)}
                            </div>
                            <div class="text-sm font-semibold text-slate-800 flex items-center gap-2">
                                <span class="text-emerald-600">🏁 到:</span> ${escapeHtml(b.to)}
                            </div>

                            <div class="text-xs text-slate-500 flex items-center gap-3 pt-1">
                                <span>🎫 票种: ${escapeHtml(b.ticket)}</span>
                                ${b.note ? `<span>📝 备注: ${escapeHtml(b.note)}</span>` : ''}
                            </div>
                        </div>

                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100">
                            <button onclick="copyBookingDetails('${b.date}', '${b.time}', '${escapeHtml(b.from)}', '${escapeHtml(b.to)}', '${b.no || '无'}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3 py-2 rounded-xl transition">
                                📋 复制详情
                            </button>
                            <button onclick="editBooking('${b.id}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-medium px-3 py-2 rounded-xl transition">
                                ✏️ 编辑
                            </button>
                            <button onclick="deleteBooking('${b.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-medium px-3 py-2 rounded-xl transition">
                                🗑️ 删除
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Modal Controls
        function openModal(id = null) {
            document.getElementById('booking-modal').classList.remove('hidden');
            if (id) {
                document.getElementById('modal-title').innerText = '编辑预约行程';
                const bookings = getBookings();
                const b = bookings.find(item => item.id === id);
                if (b) {
                    document.getElementById('booking-id').value = b.id;
                    document.getElementById('b-date').value = b.date;
                    document.getElementById('b-time').value = b.time;
                    document.getElementById('b-from').value = b.from;
                    document.getElementById('b-to').value = b.to;
                    document.getElementById('b-no').value = b.no || '';
                    document.getElementById('b-ticket').value = b.ticket;
                    document.getElementById('b-note').value = b.note || '';
                }
            } else {
                document.getElementById('modal-title').innerText = '新增预约行程';
                document.getElementById('booking-form').reset();
                document.getElementById('booking-id').value = '';
                document.getElementById('b-date').valueAsDate = new Date();
            }
        }

        function closeModal() {
            document.getElementById('booking-modal').classList.add('hidden');
        }

        // Save Booking (Add or Update)
        function saveBooking(event) {
            event.preventDefault();
            const id = document.getElementById('booking-id').value;
            const newBooking = {
                id: id ? id : '_' + Math.random().toString(36).substr(2, 9),
                date: document.getElementById('b-date').value,
                time: document.getElementById('b-time').value,
                from: document.getElementById('b-from').value,
                to: document.getElementById('b-to').value,
                no: document.getElementById('b-no').value,
                ticket: document.getElementById('b-ticket').value,
                note: document.getElementById('b-note').value
            };

            let bookings = getBookings();
            if (id) {
                bookings = bookings.map(b => b.id === id ? newBooking : b);
                showToast('已成功更新预约记录');
            } else {
                bookings.push(newBooking);
                showToast('已成功添加预约记录');
            }

            saveBookingsToStorage(bookings);
            closeModal();
            renderBookings();
        }

        // Delete Booking
        function deleteBooking(id) {
            if (confirm('确定要删除这条预约记录吗？')) {
                let bookings = getBookings();
                bookings = bookings.filter(b => b.id !== id);
                saveBookingsToStorage(bookings);
                renderBookings();
                showToast('记录已删除');
            }
        }

        // Edit Booking Helper
        function editBooking(id) {
            openModal(id);
        }

        // Copy Booking Details for easy sharing or driver check
        function copyBookingDetails(date, time, from, to, no) {
            const text = `[TaxiBus 预约信息]\n日期: ${date} ${time}\n出发: ${from}\n到达: ${to}\n预订号: ${no}`;
            
            // Fallback for iframe copy
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('预约详情已复制到剪贴板');
            } catch (err) {
                alert('复制失败，请手动复制');
            }
            document.body.removeChild(textArea);
        }

        // Toast Notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
