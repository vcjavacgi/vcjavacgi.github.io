<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R49 TaxiBus 快捷预订助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-6 px-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <!-- 头部 -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-4 text-white flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold">🚖 R49 TaxiBus 快捷助手</h1>
                <p class="text-xs text-blue-100">Saßmicke ➔ Wende/Hillmicke</p>
            </div>
            <a href="https://esm.ansat.de/VGWS/ansat/ast_efa.aspx?Auskunft" target="_blank" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg transition text-white font-medium flex items-center gap-1">
                📋 查订单/取消
            </a>
        </div>

        <div class="p-6 space-y-5">
            <!-- 官方凭证 -->
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-amber-800 uppercase tracking-wider">🔑 官方账户凭证 (自动记忆)</span>
                    <button onclick="saveCreds()" class="text-xs text-amber-700 hover:text-amber-900 font-semibold underline">保存凭证</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] text-slate-500 mb-1">E-Mail</label>
                        <input type="email" id="email" class="w-full text-xs border border-amber-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-amber-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-500 mb-1">Passwort</label>
                        <input type="password" id="password" class="w-full text-xs border border-amber-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-amber-400 outline-none">
                    </div>
                </div>
            </div>

            <!-- 核心行程配置 -->
            <div class="space-y-4">
                <div class="flex justify-between items-center bg-slate-100 px-3 py-2 rounded-lg">
                    <span class="text-xs font-bold text-slate-700">路线：L 512/Saßmicke ➔ Wende/Hillmicke</span>
                    <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-0.5 rounded">线路 03049</span>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">乘车日期 (Datum) *</label>
                        <input type="date" id="date" class="w-full text-xs border border-slate-200 rounded-xl px-3 py-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">发车时间 *</label>
                        <input type="text" id="time" value="08:23 (an 08:34)" readonly class="w-full text-xs border border-slate-200 rounded-xl px-3 py-2.5 bg-slate-100 text-slate-500 cursor-not-allowed">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">乘车人数 (Fahrgäste) *</label>
                        <select id="passengers" class="w-full text-xs border border-slate-200 rounded-xl px-3 py-2.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="1">1 人 (自己)</option>
                            <option value="2">2 人 (含同行)</option>
                            <option value="3">3 人</option>
                            <option value="4">4 人</option>
                            <option value="5">5 人</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">车票类型 *</label>
                        <select id="ticket" class="w-full text-xs border border-slate-200 rounded-xl px-3 py-2.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="Zeitkarte vorh.">Zeitkarte: vorh. (月票/D-Ticket)</option>
                            <option value="Einzelfahrkarte Erwachsene">Einzelfahrkarte Erwachsene</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">司机备注 (Info für Fahrer / 选填)</label>
                    <input type="text" id="note" placeholder="例如: 2人同行，携带月票" class="w-full text-xs border border-slate-200 rounded-xl px-3 py-2.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="space-y-2 pt-2">
                <button onclick="goToOfficial()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                    🚀 一键打开官方并预约
                </button>
                <button onclick="saveLocalLog()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 px-4 rounded-xl transition text-xs">
                    💾 仅保存到本地行程备忘
                </button>
            </div>

            <!-- 本地记录列表 -->
            <div class="border-t border-slate-100 pt-4">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-slate-500">已保存的本地行程</span>
                    <span id="countBadge" class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">共 0 条</span>
                </div>
                <div id="logList" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script>
        // 初始化日期默认明天
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('date').value = tomorrow.toISOString().split('T')[0];

        // 加载缓存
        window.onload = function() {
            if(localStorage.getItem('tb_email')) document.getElementById('email').value = localStorage.getItem('tb_email');
            if(localStorage.getItem('tb_pass')) document.getElementById('password').value = localStorage.getItem('tb_pass');
            renderLogs();
        };

        function saveCreds() {
            localStorage.setItem('tb_email', document.getElementById('email').value);
            localStorage.setItem('tb_pass', document.getElementById('password').value);
            alert('账户凭证已安全保存在您的本地浏览器中！');
        }

        function goToOfficial() {
            saveCreds();
            const date = document.getElementById('date').value;
            const pass = document.getElementById('passengers').value;
            const note = document.getElementById('note').value;
            
            // 同时记录到本地备忘
            const logs = JSON.parse(localStorage.getItem('tb_logs') || '[]');
            logs.unshift({ date, time: '08:23', pass, note, id: Date.now() });
            localStorage.setItem('tb_logs', JSON.stringify(logs));
            renderLogs();

            // 跳转到官方预订页
            window.open('https://esm.ansat.de/VGWS/ansat/ast_efa.aspx', '_blank');
        }

        function saveLocalLog() {
            const date = document.getElementById('date').value;
            const pass = document.getElementById('passengers').value;
            const note = document.getElementById('note').value;
            const logs = JSON.parse(localStorage.getItem('tb_logs') || '[]');
            logs.unshift({ date, time: '08:23', pass, note, id: Date.now() });
            localStorage.setItem('tb_logs', JSON.stringify(logs));
            renderLogs();
            alert('已成功存入本地行程备忘！');
        }

        function renderLogs() {
            const logs = JSON.parse(localStorage.getItem('tb_logs') || '[]');
            const container = document.getElementById('logList');
            document.getElementById('countBadge').innerText = `共 ${logs.length} 条`;
            if(logs.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-slate-400 py-3">暂无本地行程记录</p>';
                return;
            }
            container.innerHTML = logs.map(item => `
                <div class="bg-slate-50 border border-slate-100 p-2.5 rounded-xl text-xs flex justify-between items-center">
                    <div>
                        <span class="font-bold text-slate-700">📅 ${item.date} 08:23</span>
                        <span class="ml-2 bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded text-[10px]">👥 ${item.pass}人</span>
                        <div class="text-slate-500 text-[11px] mt-0.5">Saßmicke ➔ Wende/Hillmicke</div>
                    </div>
                    <button onclick="deleteLog(${item.id})" class="text-red-500 hover:text-red-700 text-xs px-2 py-1">删除</button>
                </div>
            `).join('');
        }

        function deleteLog(id) {
            let logs = JSON.parse(localStorage.getItem('tb_logs') || '[]');
            logs = logs.filter(i => i.id !== id);
            localStorage.setItem('tb_logs', JSON.stringify(logs));
            renderLogs();
        }
    </script>
</body>
</html>
